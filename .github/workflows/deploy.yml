name: Deploy to Fly.io

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-kumaushi-climate
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only --app kumaushi-climate --wait-timeout=120
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
